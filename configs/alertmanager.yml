## Prometheus AlertManager — Data Trust Agent
## Docs : https://prometheus.io/docs/alerting/latest/configuration/
##
## Démarrage : docker compose up alertmanager
## UI        : http://localhost:9093
## API       : POST http://localhost:9093/api/v2/alerts

global:
  resolve_timeout: 5m

  # ── Email SMTP global ──────────────────────────────────────────────────────
  smtp_smarthost:    'smtp.gmail.com:587'
  smtp_from:         'data-trust-agent@delomid-it.com'
  smtp_auth_username: 'data-trust-agent@delomid-it.com'
  smtp_auth_password: '${SMTP_PASSWORD}'   # injecter via variable d'env
  smtp_require_tls:  true

# ── Templates ─────────────────────────────────────────────────────────────────
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# ── Routage ───────────────────────────────────────────────────────────────────
# Hiérarchie : root → par sévérité → par pipeline
route:
  # Groupe les alertes par pipeline + severity pour éviter le flood
  group_by:         ['pipeline', 'severity', 'alertname']
  group_wait:       30s     # attend 30s avant d'envoyer le premier groupe
  group_interval:   5m      # attend 5m avant de ré-envoyer un groupe existant
  repeat_interval:  1h      # répète une alerte active toutes les heures
  receiver:         default

  routes:
    # Alertes critiques → Ops immédiatement
    - match:
        severity: critical
      receiver: ops-critical
      group_wait:      10s
      repeat_interval: 30m
      continue: true      # continue vers les routes suivantes

    # Alertes warning → channel Teams général
    - match:
        severity: warning
      receiver: ops-warning
      group_wait:      60s
      repeat_interval: 2h

    # Pipeline clean_sales → receiver dédié (rejet élevé fréquent)
    - match:
        pipeline: clean_sales
      receiver: pipeline-clean-sales
      group_wait:      30s

    # Alertes info → silencieuses (log uniquement)
    - match:
        severity: info
      receiver: sink
      repeat_interval: 24h

# ── Silences automatiques ─────────────────────────────────────────────────────
# Configurables via l'UI http://localhost:9093/#/silences
# Exemple : silence le week-end pour le pipeline aggregate_sales
inhibit_rules:
  # Si CRITICAL sur un pipeline, inhibe les WARNING du même pipeline
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['pipeline']

# ── Receivers ─────────────────────────────────────────────────────────────────
receivers:
  # Receiver par défaut — console uniquement (webhook vers Data Trust API)
  - name: default
    webhook_configs:
      - url: 'http://metrics-api:8090/api/v1/alerts/webhook'
        send_resolved: true
        http_config:
          tls_config:
            insecure_skip_verify: true

  # Alertes CRITICAL — Teams + Email
  - name: ops-critical
    webhook_configs:
      - url: '${TEAMS_WEBHOOK_URL}'        # ex: https://outlook.office.com/webhook/...
        send_resolved: true
        title: '🔴 [CRITICAL] Data Trust Alert'
        http_config:
          tls_config:
            insecure_skip_verify: true
    email_configs:
      - to:            'ops@delomid-it.com'
        send_resolved: true
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.pipeline }} — {{ .GroupLabels.alertname }}'
        html: |
          <h2 style="color:#E81123">🔴 Alerte CRITICAL — Data Trust Agent</h2>
          {{ range .Alerts }}
          <table border="1" cellpadding="6">
            <tr><td><b>Pipeline</b></td><td>{{ .Labels.pipeline }}</td></tr>
            <tr><td><b>Métrique</b></td><td>{{ .Labels.metric }}</td></tr>
            <tr><td><b>Résumé</b></td><td>{{ .Annotations.summary }}</td></tr>
            <tr><td><b>Détail</b></td><td>{{ .Annotations.description }}</td></tr>
          </table>
          {{ end }}

  # Alertes WARNING — Teams uniquement
  - name: ops-warning
    webhook_configs:
      - url: '${TEAMS_WEBHOOK_URL}'
        send_resolved: true

  # Pipeline clean_sales — notification dédiée
  - name: pipeline-clean-sales
    webhook_configs:
      - url: '${TEAMS_WEBHOOK_URL}'
        send_resolved: true
    email_configs:
      - to:            'data-team@delomid-it.com'
        send_resolved: true
        headers:
          Subject: '[clean_sales] {{ .GroupLabels.alertname }}'

  # Sink — absorbe les alertes info (pas de notification)
  - name: sink
