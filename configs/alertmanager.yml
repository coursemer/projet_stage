## Prometheus AlertManager — Data Trust Agent
## Version : prom/alertmanager:v0.27.0
##
## UI  : http://localhost:9093
## API : POST http://localhost:9093/api/v2/alerts
##
## Pour activer Teams ou Email, remplacer les URL/credentials ci-dessous
## et décommenter les blocs correspondants.

global:
  resolve_timeout: 5m

route:
  group_by:        ['pipeline', 'severity', 'alertname']
  group_wait:      30s
  group_interval:  5m
  repeat_interval: 1h
  receiver:        default

  routes:
    - match:
        severity: critical
      receiver: ops-critical
      group_wait:      10s
      repeat_interval: 30m
      continue: true

    - match:
        severity: warning
      receiver: ops-warning
      group_wait:      60s
      repeat_interval: 2h

    - match:
        pipeline: clean_sales
      receiver: pipeline-clean-sales
      group_wait: 30s

    - match:
        severity: info
      receiver: sink
      repeat_interval: 24h

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['pipeline']

receivers:
  # ── Receiver par défaut — webhook vers Data Trust API ─────────────────────
  - name: default
    webhook_configs:
      - url:           'http://metrics-api:8090/api/v1/alerts/webhook'
        send_resolved: true
        http_config:
          tls_config:
            insecure_skip_verify: true

  # ── CRITICAL — webhook + email (décommenter et configurer pour activer) ───
  - name: ops-critical
    webhook_configs:
      - url:           'http://metrics-api:8090/api/v1/alerts/webhook'
        send_resolved: true
    ## Pour Teams : décommenter et remplacer l'URL du webhook
    # - url:           'https://outlook.office.com/webhook/VOTRE-WEBHOOK-TEAMS'
    #   send_resolved: true
    ## Pour Email : décommenter et configurer global.smtp_* au dessus
    # email_configs:
    #   - to:            'ops@delomid-it.com'
    #     send_resolved: true
    #     headers:
    #       Subject: '[CRITICAL] {{ .GroupLabels.pipeline }} — {{ .GroupLabels.alertname }}'
    #     html: |
    #       <h2>🔴 Alerte CRITICAL — Data Trust Agent</h2>
    #       {{ range .Alerts }}
    #       <p><b>Pipeline:</b> {{ .Labels.pipeline }}<br>
    #          <b>Métrique:</b> {{ .Labels.metric }}<br>
    #          <b>Détail:</b> {{ .Annotations.description }}</p>
    #       {{ end }}

  # ── WARNING — webhook ─────────────────────────────────────────────────────
  - name: ops-warning
    webhook_configs:
      - url:           'http://metrics-api:8090/api/v1/alerts/webhook'
        send_resolved: true

  # ── Pipeline clean_sales — receiver dédié ────────────────────────────────
  - name: pipeline-clean-sales
    webhook_configs:
      - url:           'http://metrics-api:8090/api/v1/alerts/webhook'
        send_resolved: true

  # ── Sink — absorbe les alertes info sans notification ─────────────────────
  - name: sink
