version: '3.8'

services:
  metrics-api:
    image: python:3.11-slim
    working_dir: /app
    ports:
      - "8090:8090"
    volumes:
      - .:/app
    depends_on:
      - influxdb
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: data-trust-token-2026
      INFLUX_ORG: data-trust
      INFLUX_BUCKET: metrics
    command: >
      bash -c "pip install fastapi uvicorn influxdb-client pydantic --quiet &&
               python spark/metrics/api.py --host 0.0.0.0 --port 8090"

  airflow:
    image: apache/airflow:latest
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: sqlite:////tmp/airflow.db
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    command: >
      bash -c "airflow db init &&
               airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true &&
               airflow webserver -p 8080"

  spark-master:
    image: docker.io/library/python:3.11-slim
    working_dir: /spark
    ports:
      - "7077:7077"
      - "8081:8081"
    volumes:
      - ./spark/apps:/spark/apps
      - ./spark/data:/spark/data
    command: bash -c "pip install pyspark && sleep 1000"

  spark-worker:
    image: docker.io/library/python:3.11-slim
    working_dir: /spark
    environment:
      MASTER: spark://spark-master:7077
    ports:
      - "8082:8080"
    volumes:
      - ./spark/apps:/spark/apps
      - ./spark/data:/spark/data
    depends_on:
      - spark-master
    command: bash -c "pip install pyspark && sleep 1000"

  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: timescaledb
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: psswrd
      POSTGRES_DB: metrics_db
    ports:
      - "5433:5432"

  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminadmin
      DOCKER_INFLUXDB_INIT_ORG: data-trust
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: data-trust-token-2026